[project]
name = "PotentialClientsResearcher"
version = "0.1.0"
description = ""
authors = [
    {name = "lcalmagro",email = "99207162+lcalmagro@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv (>=0.9.9,<0.10.0)",
    "requests (>=2.34.2,<3.0.0)",
    "openpyxl (>=3.1.5,<4.0.0)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "click (>=8.5.0,<9.0.0)",
    "google-genai (>=2.34.0,<3.0.0)",
    "pandas (>=3.1.0,<4.0.0)",
    "bs4 (>=0.0.2,<0.0.3)"
]

[tool.poetry]
name = "researcher"
packages = [{ include = "researcher" }]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
investigar_potenciales_clientes = "researcher.cli:investigate_and_export_places_command"

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
pythonpath = [".", "researcher"]
